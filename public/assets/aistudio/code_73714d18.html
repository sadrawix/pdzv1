<script>
  // Simple micro-interaction scripts for Scanner tab controls
  (function initScannerControls() {
    // 1. Flash Toggle
    const flashBtn = document.getElementById('flash-toggle');
    const flashIcon = document.getElementById('flash-icon');
    const flashLabel = document.getElementById('flash-label');
    const flashStates = [
      { mode: 'Auto', icon: 'flash_auto', color: 'text-yellow-300' },
      { mode: 'On', icon: 'flash_on', color: 'text-yellow-400' },
      { mode: 'Off', icon: 'flash_off', color: 'text-white/60' }
    ];
    let flashIdx = 0;

    if (flashBtn) {
      flashBtn.addEventListener('click', () => {
        flashIdx = (flashIdx + 1) % flashStates.length;
        const state = flashStates[flashIdx];
        flashIcon.textContent = state.icon;
        flashLabel.textContent = state.mode;
        flashIcon.className = `material-symbols-outlined text-[18px] ${state.color}`;
      });
    }

    // 2. Preset Pills Selector
    const pills = document.querySelectorAll('.preset-pill');
    pills.forEach(pill => {
      pill.addEventListener('click', () => {
        pills.forEach(p => {
          p.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
          p.classList.add('text-surface-container-highest/80');
        });
        pill.classList.remove('text-surface-container-highest/80');
        pill.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
      });
    });

    // 3. Grid Overlay Toggle
    const gridBtn = document.getElementById('grid-toggle-btn');
    const gridOverlay = document.getElementById('grid-overlay');
    const gridIcon = document.getElementById('grid-icon-indicator');
    let gridVisible = true;

    if (gridBtn && gridOverlay) {
      gridBtn.addEventListener('click', () => {
        gridVisible = !gridVisible;
        gridOverlay.style.opacity = gridVisible ? '0.4' : '0';
        gridIcon.classList.toggle('text-tertiary-fixed-dim', gridVisible);
        gridIcon.classList.toggle('text-white/40', !gridVisible);
      });
    }

    // 4. Auto / Manual Mode Toggle
    const modeAuto = document.getElementById('mode-auto');
    const modeManual = document.getElementById('mode-manual');
    if (modeAuto && modeManual) {
      modeAuto.addEventListener('click', () => {
        modeAuto.className = 'px-2.5 py-0.5 rounded-full bg-surface-container-lowest text-on-surface font-semibold shadow-xs';
        modeManual.className = 'px-2.5 py-0.5 rounded-full text-surface-container-highest/70 hover:text-white';
      });
      modeManual.addEventListener('click', () => {
        modeManual.className = 'px-2.5 py-0.5 rounded-full bg-surface-container-lowest text-on-surface font-semibold shadow-xs';
        modeAuto.className = 'px-2.5 py-0.5 rounded-full text-surface-container-highest/70 hover:text-white';
      });
    }

    // 5. Shutter Haptic Simulation
    const shutter = document.getElementById('shutter-button');
    if (shutter) {
      shutter.addEventListener('click', () => {
        // Subtle shutter flash feedback
        const flashOverlay = document.createElement('div');
        flashOverlay.className = 'absolute inset-0 bg-white z-50 pointer-events-none transition-opacity duration-300';
        shutter.closest('.relative.w-full').appendChild(flashOverlay);
        setTimeout(() => {
          flashOverlay.style.opacity = '0';
          setTimeout(() => flashOverlay.remove(), 300);
        }, 40);
      });
    }
  })();
</script>
